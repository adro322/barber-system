spring.application.name=backend

# Configuracion para cargar variables de entorno desde un archivo .env.properties
spring.config.import=optional:file:.env[.properties]

# Conexion a la Base de Datos PostgreSQL (Supabase)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# spring.sql.init.mode=always

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3

# JWT
jwt.secret=${JWT_SECRET:barberves_secret_key_2026_integrador_utp_secure}
jwt.expiration=86400000

# VARIABLES PARA APACHE COMMONS EMAIL
mail.remitente=${MAIL_USER}
mail.password=${MAIL_APP_PASSWORD}

# CORS - URL del frontend (configurar FRONTEND_URL en produccion con la URL de Vercel)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Email del administrador para notificaciones automaticas
admin.email=${ADMIN_EMAIL:dekofandub43@gmail.com}