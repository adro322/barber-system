<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo oscuro redondeado -->
  <rect width="32" height="32" rx="7" fill="#0d0d14"/>

  <!-- Poste de barbería: 3 franjas verticales -->
  <rect x="13" y="5" width="6" height="22" rx="3" fill="#1a1a2e"/>
  <rect x="13" y="5" width="2" height="22" rx="1" fill="#e63946"/>
  <rect x="17" y="5" width="2" height="22" rx="1" fill="#457b9d"/>
  <!-- Franja dorada central -->
  <rect x="15" y="5" width="2" height="22" fill="#c9a84c"/>

  <!-- Tapa superior e inferior del poste -->
  <rect x="11" y="4" width="10" height="3" rx="1.5" fill="#c9a84c"/>
  <rect x="11" y="25" width="10" height="3" rx="1.5" fill="#c9a84c"/>
</svg>
