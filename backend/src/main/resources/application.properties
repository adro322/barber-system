spring.application.name=backend

# Puerto dinamico para Railway (usa $PORT si existe, sino 8080)
server.port=${PORT:8080}

# Configuracion para cargar variables de entorno desde un archivo .env.properties
spring.config.import=optional:file:.env[.properties]

# Conexion a la Base de Datos PostgreSQL (Supabase)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

# spring.sql.init.mode=always

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3

# JWT
jwt.secret=${JWT_SECRET:barberves_secret_key_2026_integrador_utp_secure}
jwt.expiration=86400000

# Función serverless de Vercel que envía emails via Gmail SMTP
email.api.url=${EMAIL_API_URL}
email.api.secret=${EMAIL_API_SECRET}

# CORS - URL del frontend (configurar FRONTEND_URL en produccion con la URL de Vercel)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Email del administrador para notificaciones automaticas
admin.email=${ADMIN_EMAIL:dekofandub43@gmail.com}